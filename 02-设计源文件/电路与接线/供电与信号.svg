<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 669" role="img"><title>单电池供电与信号</title><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173038} .h{font-weight:700} .dim{stroke:#347c79;stroke-width:1.4;fill:none}</style><rect width="100%" height="100%" fill="#fcfbf6"/><text x="44" y="50" font-size="31" text-anchor="start" class="h">供电与信号</text><text x="44" y="80" font-size="17" text-anchor="start" class="">单电池盒 · 共地 · 车头从左到右接五路模拟输入</text><rect x="44" y="120" width="191" height="63" rx="3" fill="#e9ebdd" stroke="#527273" stroke-width="1.4"/><text x="58" y="145" font-size="18" text-anchor="start" class="h">AA 镍氢串联盒</text><text x="58" y="169" font-size="15" text-anchor="start" class="">四节同型号电池</text><rect x="274" y="120" width="183" height="63" rx="3" fill="#efe0c3" stroke="#527273" stroke-width="1.4"/><text x="288" y="145" font-size="18" text-anchor="start" class="h">保险 → 总开关</text><text x="288" y="169" font-size="15" text-anchor="start" class="">按实测电流选型</text><line x1="235" y1="151" x2="274" y2="151" stroke="#347c79" stroke-width="2"/><line x1="457" y1="151" x2="493" y2="151" stroke="#347c79" stroke-width="2"/><line x1="493" y1="151" x2="493" y2="272" stroke="#347c79" stroke-width="2"/><line x1="493" y1="151" x2="550" y2="151" stroke="#347c79" stroke-width="2"/><line x1="493" y1="272" x2="550" y2="272" stroke="#347c79" stroke-width="2"/><rect x="550" y="119" width="182" height="65" rx="3" fill="#efe0c3" stroke="#527273" stroke-width="1.4"/><text x="564" y="144" font-size="18" text-anchor="start" class="h">DRV8833 · VM</text><text x="564" y="168" font-size="15" text-anchor="start" class="">原电池电压</text><line x1="732" y1="152" x2="778" y2="152" stroke="#347c79" stroke-width="2"/><rect x="778" y="119" width="210" height="65" rx="3" fill="#e9ebdd" stroke="#527273" stroke-width="1.4"/><text x="792" y="144" font-size="18" text-anchor="start" class="h">左右直流电机</text><text x="792" y="168" font-size="15" text-anchor="start" class="">AOUT、BOUT 各一路</text><rect x="550" y="240" width="182" height="63" rx="3" fill="#e0efe9" stroke="#527273" stroke-width="1.4"/><text x="564" y="265" font-size="18" text-anchor="start" class="h">自动升降压</text><text x="564" y="289" font-size="15" text-anchor="start" class="">固定输出 5 V</text><line x1="732" y1="272" x2="778" y2="272" stroke="#347c79" stroke-width="2"/><rect x="778" y="240" width="210" height="63" rx="3" fill="#e0efe9" stroke="#527273" stroke-width="1.4"/><text x="792" y="265" font-size="18" text-anchor="start" class="h">逻辑电源母线</text><text x="792" y="289" font-size="15" text-anchor="start" class="">Nano 5V 及各载板 VIN</text><text x="44" y="270" font-size="18" text-anchor="start" class="h">GND</text><text x="44" y="300" font-size="17" text-anchor="start" class="">电池负端、驱动地、稳压地与所有模块地相连。</text><line x1="44" y1="343" x2="988" y2="343" stroke="#b5c3bc" stroke-width="2"/><text x="44" y="393" font-size="24" text-anchor="start" class="h">Nano 信号连接</text><text x="62" y="437" font-size="17" text-anchor="start" class="h">A0 · A1 · A2 · A3 · A6</text><line x1="305" y1="431" x2="365" y2="431" stroke="#347c79" stroke-width="2"/><text x="386" y="437" font-size="17" text-anchor="start" class="">五路反射板　最左 → 最右</text><text x="62" y="475" font-size="17" text-anchor="start" class="h">A4 SDA · A5 SCL</text><line x1="305" y1="469" x2="365" y2="469" stroke="#347c79" stroke-width="2"/><text x="386" y="475" font-size="17" text-anchor="start" class="">左右 GY-530 共用 I²C 总线</text><text x="62" y="513" font-size="17" text-anchor="start" class="h">D7 · D8</text><line x1="305" y1="507" x2="365" y2="507" stroke="#347c79" stroke-width="2"/><text x="386" y="513" font-size="17" text-anchor="start" class="">左、右 XSHUT　只拉低或释放</text><text x="62" y="551" font-size="17" text-anchor="start" class="h">D2 · D3</text><line x1="305" y1="545" x2="365" y2="545" stroke="#347c79" stroke-width="2"/><text x="386" y="551" font-size="17" text-anchor="start" class="">左、右测速模块 DO</text><text x="62" y="589" font-size="17" text-anchor="start" class="h">D5 / D6 · D9 / D10</text><line x1="305" y1="583" x2="365" y2="583" stroke="#347c79" stroke-width="2"/><text x="386" y="589" font-size="17" text-anchor="start" class="">左、右电机驱动输入</text><text x="62" y="627" font-size="17" text-anchor="start" class="h">D4 · D0 / D1</text><line x1="305" y1="621" x2="365" y2="621" stroke="#347c79" stroke-width="2"/><text x="386" y="627" font-size="17" text-anchor="start" class="">启动键对地 · USB 串口调试</text></svg>